name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://newslingo:newslingo_dev_only@127.0.0.1:5432/newslingo?schema=public
  NEXT_TELEMETRY_DISABLED: "1"
  TEST_DATABASE_URL: postgresql://newslingo:newslingo_dev_only@127.0.0.1:5432/newslingo_test?schema=public

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pinned pnpm and Node.js, then install dependencies
        uses: pnpm/setup@v2
        with:
          cache: true
          require-lockfile: true
          runtime: node@24.7.0

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Check database schema formatting
        run: pnpm db:format && git diff --exit-code -- prisma/schema.prisma

      - name: Validate database schema
        run: pnpm db:validate

      - name: Generate database client
        run: pnpm db:generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Start PostgreSQL
        run: pnpm db:up

      - name: Apply migrations to the isolated test database
        run: pnpm db:migrate:test

      # The test commands swap in TEST_DATABASE_URL themselves after a safety
      # guard, so DATABASE_URL must keep naming the application database here.
      - name: Database integration tests
        run: pnpm test:integration

      - name: Build
        run: pnpm build

      - name: Install Google Chrome for browser tests
        run: pnpm exec playwright install --with-deps chrome

      # Resets the test database to the demo dataset, then serves the build.
      - name: Browser and accessibility tests
        run: pnpm test:e2e

      - name: Upload the browser test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
