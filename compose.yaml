name: newslingo

services:
  postgres:
    image: postgres:18-bookworm
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_DB: newslingo
      POSTGRES_USER: newslingo
      POSTGRES_PASSWORD: newslingo_dev_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
